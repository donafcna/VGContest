name: Noel iOS

on:
  push:
    branches: [main]
    paths:
      - "apps/noel-space-pirates/**"
      - ".github/workflows/noel-ios.yml"
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/noel-space-pirates

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/noel-space-pirates/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Synchronize native project
        run: npx cap sync ios

      - name: Verify packaged files
        run: npm run verify

      - name: Build for iPhone Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Space-Pirates-Noel-iPhone-Simulator
          path: apps/noel-space-pirates/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
